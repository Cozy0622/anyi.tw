<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANYI CARE | 專業建築拆解 3D 預覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;900&family=Noto+Sans+TC:wght@100;400;700;900&display=swap');
        body { margin: 0; overflow: hidden; background: #0c0c0e; color: #fff; font-family: 'Montserrat', 'Noto Sans TC', sans-serif; }
        canvas { display: block; outline: none; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%);
        }
        .ui-panel {
            position: absolute; top: 40px; right: 40px;
            background: rgba(20, 20, 25, 0.85); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 4px; border-left: 4px solid #10b981;
            z-index: 100; width: 380px; pointer-events: auto;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
        }
        .btn-main {
            background: transparent; color: #10b981; border: 1px solid #10b981;
            padding: 16px; width: 100%; font-weight: 900; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            text-transform: uppercase; letter-spacing: 4px; font-size: 12px;
        }
        .btn-main:hover { background: #10b981; color: #000; letter-spacing: 6px; }
        .floor-indicator {
            position: absolute; bottom: 40px; left: 40px; display: flex; flex-direction: column; gap: 10px;
        }
        .floor-tag { padding: 4px 12px; background: rgba(255,255,255,0.05); font-size: 10px; letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.1); }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

    <div class="loading-screen" id="loader">
        <div class="text-emerald-500 font-black text-4xl mb-4 tracking-[1em]">ANYI</div>
        <div class="text-xs text-gray-500 tracking-[0.5em] animate-pulse">GENERATING ARCHITECTURAL MESH...</div>
    </div>

    <div class="overlay"></div>

    <div class="ui-panel">
        <h2 class="text-[10px] font-bold text-emerald-500 tracking-[0.5em] mb-2 uppercase">System Preview</h2>
        <h1 class="text-4xl font-black mb-4 tracking-tighter">安一旗艦大樓</h1>
        <div class="h-[1px] bg-white/10 w-full mb-6"></div>
        <p class="text-gray-400 text-sm mb-10 leading-relaxed font-light">
            本案採用模組化建築系統，將<span class="text-white">垂直綠能格柵</span>與<span class="text-white">高效能醫療空間</span>完美整合。點擊下方按鈕以展開建築爆炸視圖，檢視各樓層空間機能。
        </p>
        <button id="explodeBtn" class="btn-main">Explode Structure</button>
    </div>

    <div class="floor-indicator">
        <div class="floor-tag">RF / GARDEN & SOLAR</div>
        <div class="floor-tag">4F / PREMIUM WARD</div>
        <div class="floor-tag">3F / CLINICAL CARE</div>
        <div class="floor-tag">2F / REHABILITATION</div>
        <div class="floor-tag">1F / LOBBY & CAFE</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import gsap from 'https://cdn.skypack.dev/gsap';

        // ==========================================
        // 1. ENGINE SETUP (Optimized for performance)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c0c0e);
        scene.fog = new THREE.Fog(0x0c0c0e, 40, 150);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 重要：修正視角高度與深度，確保建築完整顯示
        camera.position.set(45, 45, 45); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); // 固定為 1.0 防止 Retina 螢幕過熱卡頓
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap; 
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        // 重要：鎖定觀察中心在建築中心
        controls.target.set(0, 10, 0); 
        controls.maxPolarAngle = Math.PI / 2 * 0.95;

        // 環境光與定向光 (單光源策略以節省效能)
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
        mainLight.position.set(20, 50, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(1024, 1024);
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);

        // ==========================================
        // 2. MATERIALS
        // ==========================================
        const mats = {
            concrete: new THREE.MeshStandardMaterial({ color: 0x333335, roughness: 0.8 }),
            slab: new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.7 }),
            wood: new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 }),
            glass: new THREE.MeshPhysicalMaterial({
                color: 0x88ccff, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.2
            }),
            metal: new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 }),
            bed: new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.9 })
        };

        // ==========================================
        // 3. ARCHITECTURAL MODULAR SYSTEM
        // ==========================================
        const floorGroups = [];
        const floorHeight = 5;
        const bWidth = 16;
        const bDepth = 12;

        function createFloor(index) {
            const group = new THREE.Group();
            group.position.y = index * floorHeight;

            // --- A. Structural Slab (與底層區隔，更厚實) ---
            const slab = new THREE.Mesh(new THREE.BoxGeometry(bWidth, 0.4, bDepth), mats.slab);
            slab.receiveShadow = true;
            group.add(slab);

            // --- B. Architectural Core (電梯與樓梯井) ---
            const core = new THREE.Mesh(new THREE.BoxGeometry(4, floorHeight, 4), mats.concrete);
            core.position.set(-4, floorHeight/2, 0);
            core.castShadow = true;
            group.add(core);

            // --- C. Interior Partition Walls (真實室內隔間) ---
            const wall1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, floorHeight, 6), mats.concrete);
            wall1.position.set(2, floorHeight/2, -3);
            group.add(wall1);

            // --- D. Furniture (具象化建模) ---
            if(index > 0) { // 養護層
                for(let r=0; r<2; r++) {
                    const room = new THREE.Group();
                    room.position.set(5, 0, r === 0 ? -3 : 3);
                    
                    // Bed Frame
                    const frame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 3.5), mats.metal);
                    frame.position.y = 0.25;
                    // Mattress
                    const mattress = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 3.3), mats.bed);
                    mattress.position.y = 0.6;
                    // Headboard
                    const head = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.2, 0.1), mats.wood);
                    head.position.set(0, 0.6, -1.7);
                    
                    room.add(frame, mattress, head);
                    group.add(room);
                }
            }

            // --- E. Facade System (現代格柵與幕牆) ---
            const glass = new THREE.Mesh(new THREE.BoxGeometry(bWidth-0.2, floorHeight-0.1, bDepth-0.2), mats.glass);
            glass.position.y = floorHeight/2;
            group.add(glass);

            // Vertical Louvers (垂直格柵 - 提升建築感的核心)
            for(let l=0; l<12; l++) {
                const louver = new THREE.Mesh(new THREE.BoxGeometry(0.1, floorHeight, 0.4), mats.wood);
                const xPos = -bWidth/2 + (bWidth/11) * l;
                louver.position.set(xPos, floorHeight/2, bDepth/2 + 0.1);
                louver.castShadow = true;
                group.add(louver);
            }

            // Curtain Wall Frames (水平橫樑)
            const beam = new THREE.Mesh(new THREE.BoxGeometry(bWidth, 0.15, bDepth), mats.metal);
            beam.position.y = floorHeight;
            group.add(beam);

            return group;
        }

        for (let i = 0; i < 5; i++) {
            const f = createFloor(i);
            scene.add(f);
            floorGroups.push(f);
        }

        // 地面 (Site Map 感)
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x080808 }));
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // 4. ANIMATION & INTERACTION
        // ==========================================
        let exploded = false;
        const btn = document.getElementById('explodeBtn');

        btn.addEventListener('click', () => {
            if(!exploded) {
                floorGroups.forEach((f, i) => {
                    // 拉開樓層
                    gsap.to(f.position, { y: i * 14, duration: 2, ease: "expo.inOut" });
                    
                    // 格柵向外推開 (零件感)
                    f.children.forEach(child => {
                        if(child.geometry.type === "BoxGeometry" && child.position.z > 5) {
                            gsap.to(child.position, { z: 12, duration: 1.5, ease: "power2.inOut" });
                        }
                    });
                });
                btn.innerText = "Reassemble Structure";
                gsap.to(camera.position, { x: 60, y: 70, z: 60, duration: 2.5, ease: "expo.inOut" });
            } else {
                floorGroups.forEach((f, i) => {
                    gsap.to(f.position, { y: i * floorHeight, duration: 2, ease: "expo.inOut" });
                    f.children.forEach(child => {
                        if(child.geometry.type === "BoxGeometry" && child.position.z > 10) {
                            gsap.to(child.position, { z: bDepth/2 + 0.1, duration: 1.5, ease: "power2.inOut" });
                        }
                    });
                });
                btn.innerText = "Explode Structure";
                gsap.to(camera.position, { x: 45, y: 45, z: 45, duration: 2.5, ease: "expo.inOut" });
            }
            exploded = !exploded;
        });

        // Loader hide
        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').remove(), 1000);
        }, 1500);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
